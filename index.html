<!DOCTYPE html>
<html>
<head>
    <title>Jenkins Docker CI/CD</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            text-align: center;
        }

        .container {
            margin-top: 120px;
            background: white;
            width: 500px;
            margin-left: auto;
            margin-right: auto;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }

        h1 {
            color: #333;
        }

        p {
            font-size: 18px;
        }

        .status {
            color: green;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Docker + Jenkins CI/CD</h1>

    <p>This website is running inside a Docker container.</p>

    <p class="status">Build Successful 🚀</p>

    <p>Deployed automatically using Jenkins.</p>

</div>

</body>
</html>
